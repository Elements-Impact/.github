version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Reduce PR noise by grouping updates
    groups:
      development-dependencies:
        patterns:
          - "@types/*"
          - "*eslint*"
          - "*prettier*"
          - "@typescript-eslint/*"
          - "jest"
          - "vitest"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "*eslint*"
          - "*prettier*"
          - "@typescript-eslint/*"
          - "jest"
          - "vitest"
    open-pull-requests-limit: 5
    reviewers:
      - "elements-impact/security-team"
    assignees:
      - "elements-impact/maintainers"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Enable version updates for pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      development-dependencies:
        patterns:
          - "pytest*"
          - "black"
          - "flake8"
          - "mypy"
          - "pre-commit"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest*"
          - "black"
          - "flake8"
          - "mypy"
          - "pre-commit"
    open-pull-requests-limit: 5
    reviewers:
      - "elements-impact/security-team"
    assignees:
      - "elements-impact/maintainers"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "elements-impact/devops-team"
    commit-message:
      prefix: "chore(docker)"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "elements-impact/devops-team"
    commit-message:
      prefix: "chore(actions)"

  # Enable version updates for Terraform (if applicable)
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "elements-impact/infrastructure-team"
    commit-message:
      prefix: "chore(terraform)"

# Global settings to reduce environmental impact
# by limiting the number of simultaneous updates
ignore:
  # Ignore patch updates for stable dependencies to reduce noise
  - dependency-name: "*"
    update-types: ["version-update:semver-patch"]
    # Only for very stable, mature libraries
    # Remove this ignore rule for security-critical dependencies